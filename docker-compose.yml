# Local demo only. Use synthetic test data, never real patient data.
# All ports are bound to 127.0.0.1, so they are not reachable from other machines.
# The engine starts with the default login admin / admin; change it at the first login.

name: infogleam-health-poc

services:
  # Open Integration Engine (OIE), the open-source continuation of Mirth Connect.
  oie:
    image: openintegrationengine/engine:4.5.2-ubuntu-jre
    container_name: oie-engine
    ports:
      - "127.0.0.1:18444:8443"  # Administrator and REST API (HTTPS, self-signed certificate)
      - "127.0.0.1:6661:6661"   # MLLP listener of the ADT_to_FHIR_Patient channel
    volumes:
      - oie-appdata:/opt/engine/appdata   # database, keystore and channels
    networks:
      - poc-net

  # Node.js app that turns the channel JSON into a FHIR R4 Patient.
  fhir-app:
    build: ./fhir-app
    container_name: fhir-logic-service   # the channel's HTTP Sender uses this name
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - poc-net

volumes:
  oie-appdata:

networks:
  poc-net:
